</style><style id="nozoom">html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}</style></head><body><div id="backAL" style="padding:calc(16px + env(safe-area-inset-top)) 16px 0;position:relative;z-index:50;max-width:1300px;margin:auto"><a href="../index.html#/simulasi" style="display:inline-flex;align-items:center;gap:10px;background:#FF6FB1;color:#2b0718;border-radius:14px;padding:12px 22px;font:900 17px Inter,system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 22px #ff6fb144">&#8592; Kembali ke ALGEBRALAB</a></div><script>if(window.top!==window.self)document.getElementById("backAL").style.display="none"</script><main class="shell at">
<div class="bar"><div class="ctl"><label class="sr" for="expression">Masukkan ungkapan algebra</label><input id="expression" value="3x + 2x + 4" placeholder="contoh: 3x + 2x + 4" autocomplete="off" spellcheck="false"><button class="primary" id="generate">Jana</button></div>
<div id="inputError" role="alert" aria-live="assertive" class="input-error" hidden></div></div>
<div class="ctrlrow"><span class="step" id="status">0 / 0 blok</span><div class="btns"><button class="primary" id="play">▶ Main</button><button id="next">Seterusnya ▶</button><button id="reset">↺ Reset</button></div></div>
<div class="srcbox"><span class="srclab">BLOK ASAL · klik blok</span><div class="tiles" id="source" aria-label="Blok asal"></div></div>
<div class="groups"><div class="group-card group-x2"><div class="group-title"><span>X²</span><span class="group-count" id="count-x2">0 blok</span></div><div class="tiles" id="group2"></div><div class="group-summary">HASIL: <strong id="summary-x2">—</strong></div></div><div class="group-card group-x"><div class="group-title"><span>X</span><span class="group-count" id="count-x">0 blok</span></div><div class="tiles" id="groupx"></div><div class="group-summary">HASIL: <strong id="summary-x">—</strong></div></div><div class="group-card group-y2"><div class="group-title"><span>Y²</span><span class="group-count" id="count-y2">0 blok</span></div><div class="tiles" id="groupy2"></div><div class="group-summary">HASIL: <strong id="summary-y2">—</strong></div></div><div class="group-card group-y"><div class="group-title"><span>Y</span><span class="group-count" id="count-y">0 blok</span></div><div class="tiles" id="groupy"></div><div class="group-summary">HASIL: <strong id="summary-y">—</strong></div></div><div class="group-card group-unit"><div class="group-title"><span>UNIT</span><span class="group-count" id="count-unit">0 blok</span></div><div class="tiles" id="group1"></div><div class="group-summary">HASIL: <strong id="summary-unit">—</strong></div></div></div>
<div class="final-card" id="finalCard"><span class="final-heading">HASIL AKHIR</span><span class="result" id="result">?</span></div>
<div hidden><div id="originalDisplay"></div><span id="finalSubtitle"></span><p class="msg" id="message"></p><input id="speed" type="hidden" value="3"></div>
</main><script>const $=id=>document.getElementById(id);
let blocks=[],running=false,runId=0;
const labels={x2:'x²',x:'x',y2:'y²',y:'y',unit:'1'};
const targets={x2:'group2',x:'groupx',y2:'groupy2',y:'groupy',unit:'group1'};
const order=['x2','x','y2','y','unit'];
function parse(input){
 let s=input.replace(/\s+/g,'').replace(/([xy])\^2/g,'$1²').replace(/−/g,'-').toLowerCase();
 if(/[a-wz]/i.test(s))throw Error('Pemboleh ubah tidak disokong. Sila gunakan x atau y sahaja (termasuk x² dan y²).');
 if(!s||!/^[0-9xy²+\-]+$/.test(s))throw Error('Input tidak sah. Gunakan contoh seperti 3x + 2y - x atau 2y² + y.');
 if(!/^[+-]/.test(s))s='+'+s;
 let terms=s.match(/[+-][^+-]+/g);
 if(!terms||terms.join('')!==s)throw Error('Format ungkapan tidak sah.');
 let out=[];
 for(const t of terms){
  const sign=t[0]==='-'?-1:1,body=t.slice(1),m=body.match(/^(\d*)(x²|y²|x|y)?$/);
  if(!m||(!m[2]&&!m[1]))throw Error('Hanya x², y², x, y dan nombor integer disokong.');
  const n=m[2]?(m[1]?Number(m[1]):1):Number(m[1]);
  if(n>40||out.length+n>40)throw Error('Melebihi had maksimum 40 blok. Sila kurangkan jumlah pekali dalam ungkapan.');
  const type=m[2]==='x²'?'x2':m[2]==='y²'?'y2':m[2]||'unit';
  for(let i=0;i<n;i++)out.push({type,sign,placed:false});
 }
 return out;
}
function tile(b,i){
 const el=document.createElement('button');el.className='tile '+b.type+(b.sign<0?' negative':'');
 el.textContent=(b.sign<0?'−':'')+labels[b.type];el.title='Klik untuk kumpulkan '+(b.sign<0?'negatif ':'')+labels[b.type];el.onclick=()=>move(i);return el;
}
function simplify(){
 const sums=Object.fromEntries(order.map(t=>[t,0]));
 blocks.filter(b=>b.placed).forEach(b=>sums[b.type]+=b.sign);
 const parts=[];
 for(const type of order){const n=sums[type];if(!n)continue;
  const body=type==='unit'?String(Math.abs(n)):(Math.abs(n)===1?'':Math.abs(n))+labels[type];parts.push({n,body});}
 return parts.map((p,i)=>(p.n<0?(i?' − ':'−'):(i?' + ':''))+p.body).join('')||'0';
}
function render(){
 for(const type of order){const c=$('count-'+type).closest('.group-card');c.hidden=!blocks.some(b=>b.type===type)}
 for(const id of ['source',...Object.values(targets)])$(id).replaceChildren();
 blocks.forEach((b,i)=>$(b.placed?targets[b.type]:'source').appendChild(tile(b,i)));
 const placed=blocks.filter(b=>b.placed).length;
 for(const type of order){
   const members=blocks.filter(b=>b.placed&&b.type===type);
   const sum=members.reduce((a,b)=>a+b.sign,0);
   $('count-'+type).textContent=members.length+' blok';
   const abs=Math.abs(sum);
   const body=type==='unit'?String(abs):(abs===1?'':abs)+labels[type];
   $('summary-'+type).textContent=members.length===0?'—':sum===0?'0':(sum<0?'−':'')+body;
 }
 $('finalCard').classList.toggle('done',placed===blocks.length);
 $('finalSubtitle').textContent=placed===blocks.length?'Ungkapan telah dipermudahkan':'Jalankan simulasi untuk melihat jawapan';
 $('status').textContent=placed+' / '+blocks.length+' blok dikumpul';
 $('result').textContent=placed===blocks.length?simplify():'?';
 if(placed===blocks.length){
  const counts=Object.fromEntries(order.map(t=>[t,[0,0]]));
  blocks.forEach(b=>counts[b.type][b.sign>0?0:1]++);
  const pairs=Object.values(counts).reduce((a,v)=>a+Math.min(...v),0);
  $('message').textContent='Selesai! '+(pairs?pairs+' pasangan positif dan negatif membentuk sifar. ':'')+'Hasil: '+simplify()+'.';
 }
}
function move(i){if(running||blocks[i].placed)return;blocks[i].placed=true;render()}
function generate(){
 runId++;running=false;
 try{
  const parsed=parse($('expression').value);
  blocks=parsed;
  $('originalDisplay').textContent=$('expression').value.trim();
  $('inputError').hidden=true;
  $('inputError').textContent='';
  $('expression').classList.remove('invalid');
  $('message').className='msg';
  $('message').textContent='Klik blok untuk mengumpulkan sebutan sejenis, atau tekan Mainkan Animasi.';
  render();
 }catch(e){
  $('inputError').hidden=false;
  $('inputError').textContent='⚠ '+e.message;
  $('expression').classList.add('invalid');
  $('message').textContent=e.message;
  $('message').className='msg warn';
 }
}
function reset(){runId++;running=false;blocks.forEach(b=>b.placed=false);$('message').className='msg';$('message').textContent='Simulasi direset. Pilih blok atau mainkan animasi.';render()}
function next(){if(running)return;let i=blocks.findIndex(b=>!b.placed);if(i>=0)move(i)}
async function play(){
 if(running)return;
 if(blocks.length && blocks.every(b=>b.placed))reset();
 running=true;
 const token=++runId;
 try{
  for(let i=0;i<blocks.length;i++){
   if(token!==runId)break;
   if(!blocks[i].placed){
    blocks[i].placed=true;
    render();
    await new Promise(resolve=>setTimeout(resolve,850-Number($('speed').value)*135));
   }
  }
 }finally{running=false}
}
$('generate').onclick=generate;$('reset').onclick=reset;$('next').onclick=next;$('play').onclick=play;

$('expression').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});generate();</script><script id="nozoomjs">(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].indexOf(e.key)>=0)e.preventDefault()});})();</script></body></html>
